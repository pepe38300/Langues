<title>Choisir une langue</title>
<style>
:root{--bg:#321A46;--card:#C9A7E8;--card-hover:#D8BDF0;--ink:#24122F;--mute:#5F3D73;--acc:#F0DFFF;--line:#A77BCB}
@media(prefers-color-scheme:dark){:root{--bg:#321A46;--card:#C9A7E8;--card-hover:#D8BDF0;--ink:#24122F;--mute:#5F3D73;--acc:#F0DFFF;--line:#A77BCB}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background:var(--bg)}
main{max-width:980px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lang{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;}
.lang:hover,.lang:focus-visible{background:var(--card-hover);border-color:var(--acc);outline:3px solid var(--acc);outline-offset:1px}
.lang .f{font-size:2.2rem;line-height:1.1}
.lang .n{font-weight:600}
.lang .fr{font-size:.8rem;color:var(--mute)}
.back{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#C9A7E8;border:1px solid #A77BCB;border-radius:12px;color:#24122F;font:inherit;font-weight:700;cursor:pointer;padding:10px 16px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.back:hover,.back:focus-visible{background:#D8BDF0;border-color:#F0DFFF;outline:3px solid #F0DFFF;outline-offset:2px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.head .f{font-size:2.6rem}
.cards{display:grid;gap:12px}
.card{display:block;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;}
a.card:hover,a.card:focus-visible{background:var(--card-hover);border-color:var(--acc);outline:3px solid var(--acc);outline-offset:1px}
.card small{display:block;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.card b{font-size:1.1rem;font-weight:600}
.card.off{opacity:.55}
.hidden{display:none}
@media(orientation:landscape) and (max-height:600px){
main{max-width:none;padding:8px 10px;min-height:100vh;display:flex;flex-direction:column}
#home{flex:1;display:flex;flex-direction:column}
#home h1,#home .sub,#q{display:none}
.grid{grid-template-columns:repeat(10,1fr);gap:5px;align-content:start}
.lang{padding:4px 2px;border-radius:8px;justify-content:center}
.lang .f{font-size:1.3rem}.lang .n{font-size:.62rem;line-height:1.1;text-align:center;overflow-wrap:anywhere}.lang .fr{display:none}
.back{margin-bottom:6px}.head{margin-bottom:8px}.head .f{font-size:2rem}.head h1{font-size:1.2rem}
.cards{grid-template-columns:repeat(3,1fr)}.card{padding:12px}.card b{font-size:.95rem}
}
.landscape-badge{display:inline-flex;margin-left:7px;padding:3px 7px;border-radius:999px;background:#6F438D;color:#fff;font-size:.82rem;font-weight:800;vertical-align:middle}#landscapeGate{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(32,14,45,.94)}#landscapeGate.visible{display:flex}.gate-box{width:min(92vw,520px);padding:28px 22px;border-radius:24px;background:#C9A7E8;color:#24122F;text-align:center;box-shadow:0 20px 65px rgba(0,0,0,.4)}.gate-icon{font-size:4rem;line-height:1;margin-bottom:14px;animation:turnPhone 1.8s ease-in-out infinite}.gate-title{font-size:1.35rem;font-weight:800;margin-bottom:8px}.gate-text{line-height:1.45;margin-bottom:18px}.gate-cancel{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;background:#6F438D;color:#fff}@keyframes turnPhone{0%,35%,100%{transform:rotate(0)}55%,80%{transform:rotate(90deg)}}@media (prefers-reduced-motion:reduce){.gate-icon{animation:none}}
/* Téléphone : trois boutons par ligne, sans réduire drapeaux ni textes */
@media (max-width:700px){
 main{padding-left:8px;padding-right:8px;padding-bottom:54px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .lang{min-width:0;padding:2px 3px;border-radius:10px;justify-content:center;gap:0;min-height:0}
 .lang .f{font-size:2.2rem;line-height:1}
 .lang .n{display:block;font-size:1rem;line-height:1.05;text-align:center;overflow-wrap:anywhere;margin:0}
 .lang .fr{display:block;font-size:.8rem;line-height:1;text-align:center;overflow-wrap:anywhere;margin:0}
}
.signature-watermark{position:fixed;right:10px;bottom:6px;z-index:20;max-width:min(78vw,360px);color:rgba(240,223,255,.34);font-size:clamp(.58rem,2vw,.72rem);line-height:1.2;text-align:right;font-style:italic;font-weight:400;letter-spacing:.01em;pointer-events:none;user-select:none;text-shadow:0 1px 2px rgba(0,0,0,.18)}

function openContent(event,url){
 event.preventDefault();
 sessionStorage.setItem('returnToLanguage',location.hash);
 location.href=url;
}
let pendingLandscapeQuestion='';const landscapeGate=document.getElementById('landscapeGate'),cancelLandscapeQuestion=document.getElementById('cancelLandscapeQuestion');function phoneIsLandscape(){return innerWidth>innerHeight}async function openLandscapeOnly(event,url){
 event.preventDefault();
 sessionStorage.setItem('returnToLanguage',location.hash);
 pendingLandscapeQuestion=url;
 if(phoneIsLandscape()){location.assign(url);return}
 try{
  if(document.documentElement.requestFullscreen&&!document.fullscreenElement){await document.documentElement.requestFullscreen()}
  if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape')}

 landscapeGate.classList.add('visible')
}function openWhenLandscape(){if(pendingLandscapeQuestion&&phoneIsLandscape()){const u=pendingLandscapeQuestion;pendingLandscapeQuestion='';landscapeGate.classList.remove('visible');location.assign(u)}}cancelLandscapeQuestion.addEventListener('click',()=>{pendingLandscapeQuestion='';landscapeGate.classList.remove('visible')});addEventListener('resize',()=>setTimeout(openWhenLandscape,150));addEventListener('orientationchange',()=>setTimeout(openWhenLandscape,400));function route(){const i=parseInt(location.hash.slice(1));

  :`<div class="card off"><small>${L[k]} · lien indisponible</small><b>${esc(it.t)}</b></div>`).join('')+'</div>';
 scrollTo(0,0)}
